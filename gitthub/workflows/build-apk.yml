name: Build Android APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Analyze, test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            tmp="$(mktemp -d)"
            (cd "$tmp" && gradle wrapper --gradle-version 8.12 --distribution-type all)
            cp "$tmp/gradlew" "$tmp/gradlew.bat" android/
            mkdir -p android/gradle/wrapper
            cp "$tmp/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
            chmod +x android/gradlew
          fi
          ls -la android/gradlew android/gradle/wrapper/

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK and name it
        run: |
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$apk" || { echo "APK not found at $apk"; exit 1; }
          mkdir -p dist
          cp "$apk" dist/masroofi-debug.apk
          ls -lh dist/masroofi-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: masroofi-debug-apk
          path: dist/masroofi-debug.apk
          if-no-files-found: error
          retention-days: 14
